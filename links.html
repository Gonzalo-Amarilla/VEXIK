<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --primary: #39FF14;
            --primary-dim: rgba(57,255,20,0.12);
            --primary-glow: rgba(57,255,20,0.35);
            --white: #ffffff;
            --gray: #a3a3a3;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--white);
            font-family: var(--font-body);
        }

        /* Canvas background */
        #bg-canvas {
            position: fixed; inset: 0;
            z-index: 0; pointer-events: none;
        }

        /* Radial glow center */
        .center-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(57,255,20,0.06) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
        }

        /* Grid overlay */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(57,255,20,0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(57,255,20,0.025) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
        }

        /* Main layout */
        .page {
            position: relative; z-index: 1;
            width: 100%; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 2rem 1.5rem;
            gap: 0;
        }

        /* Logo */
        .logo-wrap {
            opacity: 0; transform: translateY(-20px);
            margin-bottom: 1rem;
        }
        .logo-wrap img {
            width: 72px; height: 72px;
            border-radius: 18px;
            display: block;
        }

        /* Brand */
        .brand-wrap {
            text-align: center;
            opacity: 0; transform: translateY(-15px);
            margin-bottom: 0.3rem;
        }
        .brand-name {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 8vw, 3.2rem);
            letter-spacing: 4px;
            line-height: 1;
            color: var(--white);
        }
        .brand-name span { color: var(--primary); }
        .brand-tagline {
            font-size: clamp(0.7rem, 2.5vw, 0.82rem);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gray);
            margin-top: 0.4rem;
        }

        /* Divider */
        .divider {
            width: 40px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0;
            margin: 1rem 0 1.2rem;
        }

        /* Links list */
        .links-list {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 0.95rem 1.5rem;
            border-radius: 14px;
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0; transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1),
                        box-shadow 0.3s,
                        background 0.3s,
                        border-color 0.3s;
        }

        /* Button fill on hover */
        .link-btn::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--primary);
            transform: translateX(-101%);
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
            border-radius: inherit;
            z-index: 0;
        }
        .link-btn:hover::before { transform: translateX(0); }
        .link-btn:hover { color: #080808; transform: translateY(-2px) scale(1.01); }
        .link-btn:active { transform: scale(0.98); }

        .link-btn-icon, .link-btn-text, .link-btn-arrow {
            position: relative; z-index: 1;
        }

        .link-btn-icon {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .link-btn-icon svg { width: 18px; height: 18px; }

        .link-btn-text { flex: 1; }
        .link-btn-arrow { opacity: 0.5; font-size: 0.9rem; transition: opacity 0.3s, transform 0.3s; }
        .link-btn:hover .link-btn-arrow { opacity: 1; transform: translateX(3px); }

        /* CTA button (WhatsApp) — highlighted */
        .link-btn.cta {
            background: var(--primary);
            color: #080808;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-glow), 0 4px 15px rgba(0,0,0,0.3);
        }
        .link-btn.cta::before { background: #fff; }
        .link-btn.cta:hover { box-shadow: 0 0 30px var(--primary-glow), 0 8px 25px rgba(0,0,0,0.4); }

        /* Default button */
        .link-btn.default {
            background: rgba(255,255,255,0.04);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .link-btn.default:hover { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-dim); }

        /* Footer */
        .page-footer {
            margin-top: 1.2rem;
            opacity: 0;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // --- GSAP ENTRANCE ---
        gsap.timeline({ delay: 0.1 })
            .to('#logoWrap',  { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' })
            .to('#brandWrap', { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, '-=0.4')
            .to('#divider',   { opacity: 1, duration: 0.5 }, '-=0.2')
            .to('.link-btn',  { opacity: 1, y: 0, duration: 0.5, stagger: 0.09, ease: 'power3.out' }, '-=0.2')
            .to('#pageFooter',{ opacity: 1, duration: 0.5 }, '-=0.2');

        // --- CANVAS PARTICLES ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 18000);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.2 + 0.3,
                    alpha: Math.random() * 0.25 + 0.05,
                    speed: Math.random() * 0.25 + 0.05,
                    drift: (Math.random() - 0.5) * 0.1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y -= p.speed;
                p.x += p.drift;
                if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
                if (p.x < -5 || p.x > canvas.width + 5) { p.x = Math.random() * canvas.width; }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(57,255,20,${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        resize();
        draw();
        window.addEventListener('resize', resize);
    </script>
